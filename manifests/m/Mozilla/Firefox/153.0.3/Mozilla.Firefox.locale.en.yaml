ShortDescription: The legendary web browser by Mozilla.
Description: |-
  The legendary web browser by Mozilla.

  In contrast to the version in winget-pkgs, this winget-extras version contains 80 of Firefox's 101 locales in one package, with the Winget settings, OS settings, and/or "--locale" deciding which locale gets installed on fresh installs.

  With stock Winget settings, fresh installs install the .msi version if a locale/arch has one in this manifest (Currently it's on a trial basis for en-GB and nb-NO). If there is none, it installs the .exe version.

  To install the MSIX version, use "winget install Mozilla.Firefox --installer-type msix -s winget-extras" or "winget install Mozilla.Firefox.MSIX -s winget".

  To use a different .exe locale than your OS language, or to force .exe for locales that have .msi, use "winget install Mozilla.Firefox --installer-type nullsoft -s winget-extras --locale [whichever language code you want]".

  The package also contains a portable version of Firefox, which uses the official MSIX version's files. To install that portable version, use "winget install Mozilla.Firefox --installer-type portable -s winget-extras".

  Due to a glitch in Winget as of 14th of August 2026, where "winget show" fails to show InstallerUrl-s for certain rare languages even if they are specified, the following locales cannot be picked: ach, an, ast, az, br, ff, fur, gd, ia, kab, lij, oc, sc, sco, son, sr, szl, ta, tg, trs, uz.
