Description: |-
  Drivers for certain lines of industrial, non-GeForce NVIDIA graphics cards, primarily the A-Series, H-Series, HGX-Series, L-Series, T-Series, and RTX PRO.

  As of version 596.36, the driver supports the following lineup models and up： A-Series A2, H-Series H200 NVL, HGX A100, L-Series L2, T-Series Tesla T4 (Unrelated to the car brand), RTX PRO 2000, and RTX T400

  As with the regular tool for NVIDIA driver installers, the screens will flicker once when the installation is complete.
