Description: |
  Software implementation of Dolby Digital Live. A virtual 5.1 audio device that accepts any multichannel PCM stream, encodes it to AC3 (Dolby Digital) in real time, and streams it as an S/PDIF bitstream out a chosen Toslink optical output to an AV receiver.

  Note that one of the app's dependencies (VB-Audio.VB-CABLE) require interactive installation. However, if that dependency is already installed, then Virtual AC3 Encoder will install silently.
